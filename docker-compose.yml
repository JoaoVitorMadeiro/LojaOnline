version: "2.33"
networks:
  loja_online:
    driver: bridge
services:
  db:
    image: mariadb:latest
    container_name: DataBase
    networks:
      - loja_online
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: loja_online
      MYSQL_USER: ${DB_USER:-test}
      MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-1234}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mariadb_data:/var/lib/mysql

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: ZookeeperServer
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - loja_online
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: KafkaServer
    networks:
      - loja_online
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_REPLICATION_FACTOR: 3
      KAFKA_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  user:
    image: ms-user
    container_name: MicroserviceUser
    ports:
      - "8081:8080"
    networks:
      - loja_online
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://DataBase:3306/loja_online
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-test}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-1234}
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  item:
    image: ms-item
    container_name: MicroserviceItem
    ports:
      - "8080:8081"
    networks:
      - loja_online
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://DataBase:3306/loja_online
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-test}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-1234}
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
  mariadb_data:
    driver: local